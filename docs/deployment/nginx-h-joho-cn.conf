# 后台管理 - h.joho.cn
# 在 1Panel 中创建静态网站 h.joho.cn 后，将此配置粘贴到网站 Nginx 配置中

server {
    listen 80;
    listen [::]:80;
    server_name h.joho.cn;
    index index.html index.htm;
    root /www/sites/h.joho.cn/index;

    # 全局统一代理头（location 内未显式设置时继承此处）
    # 注意：X-Forwarded-Host 用 $host 而非 $server_name，$host 才是真实访问域名（含端口）
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;

    access_log /www/sites/h.joho.cn/log/access.log main;
    error_log  /www/sites/h.joho.cn/log/error.log;

    # SSL 证书自动续期验证目录
    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }

    # SPA 前端路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Strapi API 接口反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:1337/api/;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 100m;
    }

    # Strapi 后台管理面板（支持 WebSocket）
    location /admin/ {
        proxy_pass http://127.0.0.1:1337/admin/;
    }

    # 上传文件静态资源代理
    location /uploads/ {
        proxy_pass http://127.0.0.1:1337/uploads/;
    }

    # /static/ 路由：前端 H5 静态资源优先，未命中时回退到 Strapi
    # （zhao-oss 中间件服务 /static/* → public/*，后台管理也需要访问 covers 等媒体文件）
    # 避免 alias 直连 Strapi public 目录导致前端 /static/*.png 404
    location /static/ {
        root /www/sites/h.joho.cn/index;
        try_files $uri @strapi_static;
    }

    location @strapi_static {
        proxy_pass http://127.0.0.1:1337;
    }

    error_page 404 /404.html;
}
