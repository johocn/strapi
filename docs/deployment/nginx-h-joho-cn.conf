# 后台管理 + SSO 中转 - h.joho.cn
# 在 1Panel 中创建静态网站 h.joho.cn 后，将此配置粘贴到网站 Nginx 配置中
#
# SSO 相关说明：
#   - h.joho.cn 是 SSO 中转回调所在域名（公众号网页授权域名、JS接口安全域名均填本域名）
#   - SSO 回调 URL: http://h.joho.cn/api/zhao-sso/v1/auth/wechat/callback
#   - /api/ 反代已覆盖所有 SSO 接口（/api/zhao-sso/v1/auth/*）
#   - X-Forwarded-Host 必须用 $host 而非 $server_name，否则 SSO 302 重定向 URL 会变成 localhost
#   - X-Forwarded-Proto 必须设置，否则 https 环境下回调 URL 协议错误

server {
    listen 80;
    listen [::]:80;
    server_name h.joho.cn;
    index index.php index.html index.htm default.php default.htm default.html;
    root /www/sites/h.joho.cn/index;

    # 全局统一代理头（location 内未显式设置时继承此处）
    # 注意：X-Forwarded-Host 用 $host 而非 $server_name，$host 才是真实访问域名（含端口）
    # SSO 场景下必须如此，否则 oauth-controller 生成 redirect_uri 时会用 localhost
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;

    access_log /www/sites/h.joho.cn/log/access.log main;
    error_log  /www/sites/h.joho.cn/log/error.log;

    # SSL 证书自动续期验证目录
    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }

    # SPA 前端路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Strapi API 接口反向代理
    # 覆盖所有 SSO 接口：
    #   - /api/zhao-sso/v1/auth/wechat              微信授权跳转
    #   - /api/zhao-sso/v1/auth/wechat/callback      微信中转回调
    #   - /api/zhao-sso/v1/auth/wechat/miniprogram   小程序登录
    #   - /api/zhao-sso/v1/auth/wechat/app           APP 登录
    #   - /api/zhao-sso/v1/auth/jssdk-signature      JSSDK 签名
    #   - /api/zhao-sso/v1/auth/wechat/config        微信登录配置
    #   - /api/zhao-sso/v1/auth/password-authorize   降级密码登录（code 模式）
    #   - /api/zhao-sso/v1/auth/login                降级密码登录（token 模式）
    #   - /api/zhao-sso/v1/auth/token                换取 token
    #   - /api/zhao-sso/v1/admin/*                   SSO 管理接口
    location /api/ {
        proxy_pass http://127.0.0.1:1337/api/;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 100m;
    }

    # Strapi 后台管理面板（支持 WebSocket）
    # SSO 配置入口：http://h.joho.cn/admin/plugins/zhao-sso
    location /admin/ {
        proxy_pass http://127.0.0.1:1337/admin/;
    }

    # 上传文件静态资源代理
    location /uploads/ {
        proxy_pass http://127.0.0.1:1337/uploads/;
    }

    # /static/ 路由：前端 H5 静态资源优先，未命中时回退到 Strapi
    # （zhao-oss 中间件服务 /static/* → public/*，后台管理也需要访问 covers 等媒体文件）
    # 避免 alias 直连 Strapi public 目录导致前端 /static/*.png 404
    location /static/ {
        root /www/sites/h.joho.cn/index;
        try_files $uri @strapi_static;
    }

    location @strapi_static {
        proxy_pass http://127.0.0.1:1337;
    }

    error_page 404 /404.html;
}
