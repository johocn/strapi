# C 端课程内容 - v.joho.cn
# 在 1Panel 中创建静态网站 v.joho.cn 后，将此配置粘贴到网站 Nginx 配置中
#
# SSO 相关说明：
#   - v.joho.cn 是 C 端课程内容域名，承载 invite_code（邀请码）参数
#   - 微信环境访问 v.joho.cn 登录页时，前端会自动重定向到 h.joho.cn 的 SSO 登录页
#   - SSO 登录完成后携带 code/invite_code 返回 v.joho.cn 回调页
#   - channel_code 来自 h.joho.cn，invite_code 来自 v.joho.cn，两者均在 sso channel-sync 建立分销
#   - X-Forwarded-Host 必须用 $host，确保 C 端调用 /api/zhao-sso/* 时回调 URL 正确

server {
    listen 80;
    listen [::]:80;
    server_name v.joho.cn;
    index index.html index.htm;
    root /www/sites/v.joho.cn/index;

    # 全局统一代理头（与 h.joho.cn 保持一致）
    # X-Forwarded-Host 用 $host 而非 $server_name，保证 SSO 回调 URL 正确
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;

    access_log /www/sites/v.joho.cn/log/access.log main;
    error_log  /www/sites/v.joho.cn/log/error.log;

    # Let's Encrypt 证书校验
    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }

    # Strapi API 接口反向代理
    # C 端会调用以下 SSO 接口（用于 token 兑换、降级登录等）：
    #   - /api/zhao-sso/v1/auth/token                换取 token
    #   - /api/zhao-sso/v1/auth/password-authorize   降级密码登录（code 模式）
    #   - /api/zhao-sso/v1/auth/login                降级密码登录（token 模式）
    #   - /api/zhao-sso/v1/auth/jssdk-signature      JSSDK 签名（如需在 v.joho.cn 使用微信 JSSDK）
    # 注意：微信网页授权跳转和回调走 h.joho.cn（sso 中转域名），不走 v.joho.cn
    location /api/ {
        proxy_pass http://127.0.0.1:1337/api/;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 100m;
    }

    # Strapi Admin 管理面板（含 WebSocket 升级）
    # 注意：v.joho.cn 通常不需要暴露 /admin/，建议生产环境直接返回 444
    # 此处保留以便调试，生产可改为：location /admin/ { return 444; }
    location /admin/ {
        proxy_pass http://127.0.0.1:1337/admin/;
    }

    # 文件上传
    location /uploads/ {
        proxy_pass http://127.0.0.1:1337/uploads/;
    }

    # /static/ 路由冲突修复：
    # 前端 H5 静态资源优先（tab 图标等），未命中时回退到 Strapi
    # （zhao-oss 中间件服务 /static/* → public/*，如 covers 媒体文件）
    # 避免 alias 直连 Strapi public 目录导致前端 /static/tab-*.png 404
    location /static/ {
        root /www/sites/v.joho.cn/index;
        try_files $uri @strapi_static;
    }

    location @strapi_static {
        proxy_pass http://127.0.0.1:1337;
    }

    # 前端静态文件（H5 单页应用，hash 模式路由回退到 index.html）
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /404.html;
}
