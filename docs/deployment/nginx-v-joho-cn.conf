# C 端课程内容 - v.joho.cn
# 在 1Panel 中创建静态网站 v.joho.cn 后，将此配置粘贴到网站 Nginx 配置中

server {
    listen 80;
    listen [::]:80;
    server_name v.joho.cn;
    index index.html index.htm;

    access_log /www/sites/v.joho.cn/log/access.log main;
    error_log  /www/sites/v.joho.cn/log/error.log;

    # Let's Encrypt 证书校验
    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }

    # API 反代到 Strapi（透传完整代理头，修复后端重定向到 localhost 问题）
    location /api/ {
        proxy_pass http://127.0.0.1:1337/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 100m;
    }

    # Strapi Admin 管理面板（含 WebSocket 升级）
    location /admin/ {
        proxy_pass http://127.0.0.1:1337/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 文件上传
    location /uploads/ {
        proxy_pass http://127.0.0.1:1337/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /static/ 路由冲突修复：
    # 前端 H5 静态资源优先（tab 图标等），未命中时回退到 Strapi
    # （zhao-oss 中间件服务 /static/* → public/*，如 covers 媒体文件）
    # 避免 alias 直连 Strapi public 目录导致前端 /static/tab-*.png 404
    location /static/ {
        root /www/sites/v.joho.cn/index;
        try_files $uri @strapi_static;
    }

    location @strapi_static {
        proxy_pass http://127.0.0.1:1337;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 前端静态文件（H5 单页应用，hash 模式路由回退到 index.html）
    root /www/sites/v.joho.cn/index;
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /404.html;
}
