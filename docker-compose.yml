# 所有密钥/口令均通过环境变量注入，不写入仓库。
# 使用前在 shell 或 .env 中设置，例如：
#   export APP_KEYS="$(openssl rand -base64 32),$(openssl rand -base64 32),$(openssl rand -base64 32),$(openssl rand -base64 32)"
#   export ADMIN_JWT_SECRET="$(openssl rand -base64 32)"
#   export API_TOKEN_SALT="$(openssl rand -base64 32)"
#   export TRANSFER_TOKEN_SALT="$(openssl rand -base64 32)"
#   export ENCRYPTION_KEY="$(openssl rand -base64 32)"
#   export DATABASE_PASSWORD="<设置数据库口令>"
#   export VENDURE_SUPERADMIN_PASSWORD="<设置 Vendure 超管口令>"
#   export VENDURE_COOKIE_SECRET="$(openssl rand -base64 32)"
version: '3.8'

services:
  strapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: strapi
    ports:
      - "127.0.0.1:1337:1337"
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: host.docker.internal
      DATABASE_PORT: 5432
      DATABASE_NAME: strapi_prod
      DATABASE_USERNAME: strapi_user
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_SSL: "false"

      REDIS_HOST: redis
      REDIS_PORT: 6379

      HOST: 0.0.0.0
      PORT: 1337
      APP_KEYS: ${APP_KEYS}
      API_TOKEN_SALT: ${API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      ALIYUN_OSS_REGION: ""
      ALIYUN_OSS_ACCESS_KEY_ID: ""
      ALIYUN_OSS_ACCESS_KEY_SECRET: ""
      ALIYUN_OSS_BUCKET: ""
      ALIYUN_OSS_CNAME: ""
    volumes:
      - ./uploads:/app/uploads
      - ./config:/app/config
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - app-network

  vendure:
    image: vendure/vendure:latest
    container_name: vendure
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3001:3001"
      - "127.0.0.1:3002:3002"
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: 5432
      DB_NAME: vendure_prod
      DB_USERNAME: vendure_user
      DB_PASSWORD: vendure_password

      API_PORT: 3000
      ADMIN_API_PORT: 3001
      ADMIN_UI_PORT: 3002
      SUPERADMIN_USERNAME: superadmin
      SUPERADMIN_PASSWORD: ${VENDURE_SUPERADMIN_PASSWORD}
      COOKIE_SECRET: ${VENDURE_COOKIE_SECRET}
    volumes:
      - ./vendure/assets:/app/assets
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: redis
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - app-network

volumes:
  redis-data:

networks:
  app-network:
    driver: bridge